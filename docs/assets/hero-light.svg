<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" role="img" aria-labelledby="title desc">
<title id="title">Resume Autofill</title>
<desc id="desc">Two fictional education records mapped into a resume form for human review.</desc>
